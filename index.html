<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>雲舒島模擬器</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #101827;
        color: #edf2fa;
      }

      * { box-sizing: border-box; }
      body { margin: 0; padding: 48px 20px; }
      main { max-width: 1600px; margin: auto; }
      h1 { margin: 8px 0 12px; font-size: clamp(1.8rem, 5vw, 2.5rem); }
      h2 { margin: 0; font-size: 1.25rem; }
      p { line-height: 1.6; }
      .eyebrow { color: #94bbff; letter-spacing: .12em; font-size: .8rem; }
      .muted { color: #aab8cd; }
      .group-controls { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
      .share-controls { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px; margin-left: auto; max-width: 100%; }
      #mark-duplicates[aria-pressed="true"] { background: #702633; border-color: #ff3344; }
      #share-result { margin-top: 20px; }
      #share-result label { display: block; margin-bottom: 8px; }
      #share-url {
        width: 100%;
        padding: 12px;
        border: 1px solid #526583;
        border-radius: 8px;
        background: #142035;
        color: inherit;
        font: inherit;
      }
      #groups { container-type: inline-size; }
      .picker-panels {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        align-items: start;
        gap: clamp(4px, 1.25cqw, 20px);
        margin-top: 32px;
        font-size: clamp(8px, 1cqw, 16px);
      }
      .panel {
        min-width: 0;
        padding: clamp(2px, 1.25cqw, 20px);
        border: 1px solid #34425a;
        border-radius: clamp(4px, 1.25cqw, 20px);
        background: #1a2639;
      }

      button { font: inherit; color: inherit; cursor: pointer; }
      button:focus-visible, .picker-panels:focus-visible, #share-url:focus-visible { outline: 3px solid #9fc2ff; outline-offset: 4px; }
      button:disabled { cursor: not-allowed; opacity: .5; }
      .panel-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: clamp(1px, .5cqw, 8px);
        min-height: clamp(24px, 4cqw, 56px);
        margin-bottom: clamp(4px, 1.25cqw, 20px);
      }
      .panel-actions { display: flex; gap: 2px; margin-left: auto; }
      .nirvana-button, .icon-picker {
        flex-shrink: 0;
        width: clamp(24px, 4cqw, 56px);
        height: clamp(24px, 4cqw, 56px);
        padding: 1px;
        border: 1px solid transparent;
        border-radius: 4px;
        background: transparent;
      }
      .icon-picker {
        display: flex;
        align-items: center;
        justify-content: center;
        border-color: #526583;
        font-size: clamp(18px, 1.5cqw, 24px);
      }
      .icon-picker:hover { background: #34425a; }
      .icon-picker img { width: 100%; height: 100%; object-fit: contain; }
      .nirvana-button img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: grayscale(1);
      }
      .nirvana-button[aria-pressed="true"] { border-color: #efbe6a; }
      .nirvana-button[aria-pressed="true"] img { filter: none; }
      .image-picker {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(3px, .75cqw, 12px);
        width: 100%;
        min-height: clamp(64px, 12.5cqw, 200px);
        padding: clamp(2px, 1.25cqw, 20px);
        overflow-wrap: anywhere;
        border: clamp(1px, .125cqw, 2px) dashed #6888b9;
        border-radius: clamp(3px, .875cqw, 14px);
        background: #142035;
      }
      .image-picker:hover:not(:disabled) { background: #20314c; border-color: #9fc2ff; }
      .image-picker.is-nirvana { background: #4a321d; border-color: #efbe6a; }
      .image-picker.is-nirvana:hover:not(:disabled) { background: #634323; border-color: #ffda92; }
      .image-picker.is-duplicate::after {
        content: "";
        position: absolute;
        inset: 0;
        border: 4px solid #ff3344;
        border-radius: inherit;
        box-shadow: 0 0 6px #ff3344;
        pointer-events: none;
      }
      .image-picker > * { max-width: 100%; }
      .image-picker strong:empty { display: none; }
      .section-title {
        margin: 0;
        font-size: clamp(7px, 1.25cqw, 20px);
        white-space: nowrap;
      }
      .placeholder { font-size: clamp(18px, 3cqw, 48px); color: #94bbff; }
      .preview {
        width: min(100%, clamp(32px, 7cqw, 112px));
        height: auto;
        aspect-ratio: 112 / 118;
        object-fit: contain;
      }
      .error { color: #ffb3b3; overflow-wrap: anywhere; }

      dialog {
        width: min(760px, calc(100% - 32px));
        max-height: 85vh;
        max-height: 85dvh;
        padding: 0;
        border: 1px solid #526583;
        border-radius: 20px;
        background: #1a2639;
        color: inherit;
      }
      dialog::backdrop { background: rgb(4 10 20 / 80%); }
      .dialog-content { padding: 24px; }
      .dialog-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      #dialog-title { font-weight: normal; }
      .close-button, .group-button {
        flex-shrink: 0;
        padding: 8px 14px;
        border: 1px solid #526583;
        border-radius: 8px;
        background: #263750;
      }
      .group-button:hover { background: #344b6a; }
      .image-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(108px, 1fr));
        gap: 12px;
        margin-top: 20px;
      }
      .image-option {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        min-width: 0;
        padding: 12px 6px;
        border: 2px solid #344763;
        border-radius: 12px;
        background: #142035;
      }
      .image-option:hover:not(:disabled) { border-color: #9fc2ff; background: #20314c; }
      .image-option[aria-pressed="true"] { border-color: #9fc2ff; background: #2c4265; }
      .image-option img { width: 94px; height: 99px; object-fit: contain; }
      .image-option span { max-width: 100%; overflow-wrap: anywhere; font-size: .85rem; }
      .image-option-none { min-height: 128px; justify-content: center; }

      @container (max-width: 600px) {
        .panel { padding: clamp(1px, .35cqw, 2px); }
        .panel-heading { flex-direction: column; align-items: stretch; gap: 4px; }
      }

      @media (max-width: 420px) {
        body { padding: 28px 16px; }
        .dialog-content { padding: 16px; }
      }
    </style>
  </head>

    <main>
      <div class="eyebrow">CLOUD ISLAND</div>
      <div class="group-controls">
        <button id="add-group" class="group-button" type="button" aria-controls="groups">住宅新建</button>
        <button id="delete-group" class="group-button" type="button" aria-controls="groups" hidden>住宅拆遷</button>
        <div class="share-controls">
          <button id="mark-duplicates" class="group-button" type="button" aria-controls="groups" aria-pressed="false">標記重複角色</button>
          <button id="share-settings" class="group-button" type="button" aria-controls="share-result">產生分享網址</button>
        </div>
      </div>
      <div id="share-result" hidden>
        <label for="share-url">分享網址</label>
        <input id="share-url" type="text" readonly>
        <p id="share-status" class="muted" role="status"></p>
      </div>
      <p id="state-error" class="error" role="alert" hidden></p>
      <div id="groups"></div>
      <noscript><p class="error">請啟用 JavaScript，才能開啟圖片選項。</p></noscript>
    </main>

    <template id="group-template">

          <h1 class="section-title">屋主</h1>
          <button class="image-picker landlord-picker" type="button"
            aria-haspopup="dialog" aria-controls="image-dialog">
            <span class="placeholder" aria-hidden="true">＋</span>
            <img class="preview" alt="" hidden>
            <strong></strong>
          </button>
          <p class="error" role="alert" hidden></p>
        </section>
        <section class="panel">
          <h2 class="section-title">房客 1</h2>
          <button class="image-picker tenant-picker" type="button"
            aria-haspopup="dialog" aria-controls="image-dialog" disabled>
            <span class="placeholder" aria-hidden="true">＋</span>
            <img class="preview" alt="" hidden>

        </section>

            aria-haspopup="dialog" aria-controls="image-dialog" disabled>

            <img class="preview" alt="" hidden>
            <strong></strong>
          </button>
          <p class="error" role="alert" hidden></p>
        </section>
      </div>
    </template>

        </div>
        <p id="gallery-error" class="error" role="alert" hidden></p>
        <div id="image-options" class="image-grid"></div>
      </div>
    </dialog>

      function deleteGroup() {
        if (groups.length <= 1) {
          console.warn("至少需保留一組，無法刪除最後一組。");
          return false;
        }

        const lastGroup = groups[groups.length - 1].element;
        const focusedElement = document.activeElement;
        const ownsGallery = dialog.dataset.groupId === lastGroup.id;
        const closesGallery = ownsGallery && dialog.open;
        if (ownsGallery) {
          dialog.close();
          options.replaceChildren();
          delete dialog.dataset.groupId;
        }
        lastGroup.remove();
        groups.pop();
        deleteGroupButton.hidden = groups.length <= 1;
        updateDuplicateMarkers();
        invalidateShareUrl();
        if (closesGallery || lastGroup.contains(focusedElement)
          || (deleteGroupButton.hidden && focusedElement === deleteGroupButton)) {
          (deleteGroupButton.hidden ? addGroupButton : deleteGroupButton).focus();
        }
        return true;

        const image = landlordImages[index];

        if (group.selectedLandlordIndex !== index) {
          group.selectedLandlordIndex = index;
          group.nirvana.forEach((_enabled, pickerIndex) => setNirvana(group, pickerIndex, false));
          group.icons.forEach((_filename, pickerIndex) => selectIcon(group, pickerIndex, null));
          group.tenantSlots.forEach(slot => resetTenant(slot, index));

      function selectTenant(group, index, filename) {
        const slot = group.tenantSlots[index];
        if (slot.selectedFile !== filename) {
          setNirvana(group, index + 1, false);
          selectIcon(group, index + 1, null);

        slot.selectedFile = filename;
        setPreview(slot.button, "Tenant", { filename, name: imageLabel(filename) });
        updateDuplicateMarkers();
        invalidateShareUrl();

      function updateDuplicateMarkers() {
        const selections = groups.flatMap(group => [
          { filename: group.selectedFile, button: group.element.querySelector(".landlord-picker") },
          ...group.tenantSlots.map(slot => ({ filename: slot.selectedFile, button: slot.button })),
        ]);
        const counts = new Map();
        if (markDuplicates) {
          for (const { filename } of selections) {
            if (filename !== null) counts.set(filename, (counts.get(filename) ?? 0) + 1);
          }
        }
        for (const { filename, button } of selections) {
          button.classList.toggle("is-duplicate", markDuplicates && filename !== null && counts.get(filename) > 1);
        }
      }

      function setNirvana(group, index, enabled) {
        group.nirvana[index] = enabled;
        group.element.querySelectorAll(".nirvana-button")[index].setAttribute("aria-pressed", String(enabled));

      function selectIcon(group, index, filename) {
        const button = group.element.querySelectorAll(".icon-picker")[index];
        const error = button.closest(".panel").querySelector(".icon-selection-error");
        const selectedIcon = selectableIcons.find(icon => icon.filename === filename);
        if (filename !== null && (!selectedIcon
          || groups.some(current => current.icons.some((icon, slotIndex) =>
            icon === filename && (current !== group || slotIndex !== index))))) {
          error.textContent = "此圖示不存在或已被其他位置選取，請重新開啟清單選擇。";
          error.hidden = false;
          if (dialog.open) {
            galleryError.textContent = error.textContent;
            galleryError.hidden = false;

          return false;

        group.icons[index] = filename;
        const image = button.querySelector("img");
        image.hidden = filename === null;
        button.querySelector("span").hidden = filename !== null;
        error.hidden = true;
        const label = filename === null ? "無" : selectedIcon.name;
        button.setAttribute("aria-label", `${button.dataset.label}：${label}`);
        button.title = `選擇圖示（目前：${label}）`;
        if (filename === null) {
          image.removeAttribute("src");
          delete image.dataset.filename;
        } else {
          image.dataset.filename = filename;
          image.src = `./Icons/${encodeURIComponent(filename)}`;

      function invalidateShareUrl() {
        shareRevision++;
        shareResult.hidden = true;
        shareUrlInput.value = "";
        shareStatus.textContent = "";
        shareStatus.className = "muted";
      }

      function validateSharedState(state) {
        if (!state || typeof state !== "object" || Array.isArray(state) || ![1, 2, 3].includes(state.version)) {
          throw new SharedStateError("分享設定版本不支援或格式錯誤。");
        }
        if (!Array.isArray(state.groups) || state.groups.length === 0) {
          throw new SharedStateError("分享設定至少需要一組住宅。");
        }
        const usedIcons = new Set();
        state.groups.forEach((savedGroup, index) => {
          if (!savedGroup || typeof savedGroup !== "object" || Array.isArray(savedGroup)
            || !Array.isArray(savedGroup.tenants) || savedGroup.tenants.length !== tenantConfigurations.length) {
            throw new SharedStateError(`第 ${index + 1} 組必須包含四個房客位置。`);
          }
          if (state.version >= 2 && (!Array.isArray(savedGroup.nirvana)
            || savedGroup.nirvana.length !== tenantConfigurations.length + 1
            || !savedGroup.nirvana.every(value => typeof value === "boolean"))) {
            throw new SharedStateError(`第 ${index + 1} 組必須包含五個有效的 Nirvana 狀態。`);
          }
          if (state.version === 3) {
            if (!Array.isArray(savedGroup.icons) || savedGroup.icons.length !== tenantConfigurations.length + 1) {
              throw new SharedStateError(`第 ${index + 1} 組必須包含五個圖示位置。`);
            }
            savedGroup.icons.forEach(filename => {
              if (filename === null) return;
              if (!selectableIcons.some(icon => icon.filename === filename)) {
                throw new SharedStateError(`第 ${index + 1} 組包含不支援的圖示。`);
              }
              if (usedIcons.has(filename)) {
                throw new SharedStateError("分享設定包含重複圖示，每個圖示只能在全頁使用一次。");
              }
              usedIcons.add(filename);
            });
          }
          const landlordIndex = landlordImages.findIndex(image => image.filename === savedGroup.landlord);
          if (savedGroup.landlord !== null && landlordIndex === -1) {
            throw new SharedStateError(`第 ${index + 1} 組的屋主不在目前圖庫中。`);
          }
          savedGroup.tenants.forEach((filename, slotIndex) => {
            if (filename === null) return;
            const allowedImages = tenantConfigurations[slotIndex].images[landlordIndex];
            if (landlordIndex === -1 || typeof filename !== "string"
              || !Array.isArray(allowedImages) || !allowedImages.includes(filename)) {
              throw new SharedStateError(`第 ${index + 1} 組的房客 ${slotIndex + 1} 不在此屋主允許的清單中。`);
            }
          });
        });
        return state.groups.map(savedGroup => ({
          ...savedGroup,
          nirvana: state.version === 1 ? Array(tenantConfigurations.length + 1).fill(false) : savedGroup.nirvana,
          icons: state.version < 3 ? Array(tenantConfigurations.length + 1).fill(null) : savedGroup.icons,
        }));
      }

      async function encodeSharedState(state) {
        if (typeof CompressionStream !== "function") {
          throw new SharedStateError("此瀏覽器不支援網址壓縮，請使用最新版瀏覽器。");
        }
        try {
          const stream = new Blob([JSON.stringify(state)]).stream()
            .pipeThrough(new CompressionStream("deflate"));
          const bytes = new Uint8Array(await new Response(stream).arrayBuffer());
          const binary = Array.from(bytes, byte => String.fromCharCode(byte)).join("");
          return compressedStatePrefix + btoa(binary)
            .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        } catch (error) {
          if (!(error instanceof TypeError) && !(error instanceof DOMException)) throw error;
          throw new SharedStateError("分享設定壓縮失敗，請重試或更新瀏覽器。");
        }
      }

      async function decodeSharedState(value) {
        let json = value;
        if (value.startsWith(compressedStatePrefix)) {
          if (typeof DecompressionStream !== "function") {
            throw new SharedStateError("此瀏覽器不支援網址解壓縮，請使用最新版瀏覽器。");
          }
          const payload = value.slice(compressedStatePrefix.length);
          if (!/^[A-Za-z0-9_-]+$/.test(payload) || payload.length % 4 === 1) {
            throw new SharedStateError("分享網址的壓縮參數格式錯誤。");
          }
          try {
            const binary = atob(payload.replace(/-/g, "+").replace(/_/g, "/"));
            const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
            const stream = new Blob([bytes]).stream()
              .pipeThrough(new DecompressionStream("deflate"));
            json = new TextDecoder("utf-8", { fatal: true })
              .decode(await new Response(stream).arrayBuffer());
          } catch (error) {
            if (!(error instanceof TypeError) && !(error instanceof DOMException)) throw error;
            throw new SharedStateError("分享網址的壓縮資料已損壞，請重新取得連結。");
          }
        } else if (/^z\d+\./.test(value)) {
          throw new SharedStateError("分享網址的壓縮版本不支援。");
        }
        try {
          return JSON.parse(json);
        } catch (error) {
          if (!(error instanceof SyntaxError)) throw error;
          throw new SharedStateError("網址中的設定不是有效的 JSON。");
        }
      }

      async function generateShareUrl() {
        invalidateShareUrl();
        const revision = shareRevision;
        stateError.hidden = true;
        const state = {
          version: 3,
          groups: groups.map(group => ({
            landlord: group.selectedFile,
            tenants: group.tenantSlots.map(slot => slot.selectedFile),
            nirvana: [...group.nirvana],
            icons: [...group.icons],
          })),
        };
        try {
          validateSharedState(state);
          const encodedState = await encodeSharedState(state);
          if (revision !== shareRevision) return;
          const url = new URL(shareBaseUrl);
          url.searchParams.set("state", encodedState);
          shareUrlInput.value = url.href;
          shareResult.hidden = false;
          shareUrlInput.focus();
          shareUrlInput.select();
          if (typeof navigator.clipboard?.writeText !== "function") {
            shareStatus.className = "error";
            shareStatus.textContent = "網址已產生，但此瀏覽器不支援自動複製。請手動複製網址欄位。";
            return;
          }
          shareStatus.textContent = "網址已產生，正在複製至剪貼簿…";
          try {
            await navigator.clipboard.writeText(url.href);
            if (revision !== shareRevision) return;
            shareStatus.textContent = "分享網址已複製到剪貼簿，可直接貼上分享。連結記錄的是產生當下的設定。";
          } catch (error) {
            if (!(error instanceof DOMException)) throw error;
            if (revision !== shareRevision) return;
            shareStatus.className = "error";
            shareStatus.textContent = "網址已產生，但瀏覽器未允許自動複製。請允許剪貼簿權限，或手動複製網址欄位。";
          }
        } catch (error) {
          if (!(error instanceof SharedStateError)) throw error;
          if (revision !== shareRevision) return;
          stateError.textContent = `無法產生分享網址：${error.message}`;
          stateError.hidden = false;
        }
      }

      async function initializeGroups() {
        const parameters = new URLSearchParams(window.location.search);
        if (!parameters.has("state")) {
          addGroup();
          return;
        }
        const controls = [addGroupButton, deleteGroupButton, shareSettingsButton];
        controls.forEach(button => { button.disabled = true; });
        groupsContainer.setAttribute("aria-busy", "true");
        try {
          if (parameters.getAll("state").length !== 1) {
            throw new SharedStateError("網址中有重複的 state 參數。");
          }
          const state = await decodeSharedState(parameters.get("state"));
          const savedGroups = validateSharedState(state);
          for (const savedGroup of savedGroups) {
            const group = addGroup();
            if (savedGroup.landlord !== null) {
              selectLandlord(group, landlordImages.findIndex(image => image.filename === savedGroup.landlord));
              savedGroup.tenants.forEach((filename, index) => {
                if (filename !== null) selectTenant(group, index, filename);
              });
            }
            savedGroup.nirvana.forEach((enabled, index) => setNirvana(group, index, enabled));
            savedGroup.icons.forEach((filename, index) => selectIcon(group, index, filename));
          }
        } catch (error) {
          if (!(error instanceof SharedStateError)) throw error;
          stateError.textContent = `無法還原分享設定：${error.message} 目前顯示一組空白住宅。`;
          stateError.hidden = false;
          addGroup();
        } finally {
          controls.forEach(button => { button.disabled = false; });
          groupsContainer.removeAttribute("aria-busy");
        }
      }

      function imageLabel(filename) {
        const label = filename.replace(/\.[^.]+$/, "");
        return label.charAt(0).toUpperCase() + label.slice(1);
      }

      function setPreview(button, folder, { filename, name: label }) {
        const image = button.querySelector(".preview");
        button.parentElement.querySelector(".error").hidden = true;
        image.dataset.filename = filename;
        image.alt = label;
        image.src = `./${folder}/${encodeURIComponent(filename)}`;
        image.hidden = false;
        button.querySelector(".placeholder").hidden = true;
        button.querySelector("strong").textContent = folder === "Landlord" ? label : "";
      }

      function resetTenant(slot, selectedLandlordIndex) {
        slot.selectedFile = null;
        const tenantPicker = slot.button;
        const image = tenantPicker.querySelector(".preview");
        image.hidden = true;
        image.removeAttribute("src");
        image.alt = "";
        delete image.dataset.filename;
        tenantPicker.querySelector(".placeholder").hidden = false;
        const error = tenantPicker.parentElement.querySelector(".error");
        error.hidden = true;
        const filenames = slot.images[selectedLandlordIndex];
        const valid = Array.isArray(filenames)
          && filenames.every(filename => typeof filename === "string" && filename.trim().length > 0);
        if (!valid) {
          tenantPicker.disabled = true;
          tenantPicker.querySelector("strong").textContent = "房客清單設定錯誤";
          error.textContent = `請將 ${slot.arrayName}[${selectedLandlordIndex}] 設定為圖片檔名陣列。`;
          error.hidden = false;
          return;
        }
        tenantPicker.disabled = filenames.length === 0;
        tenantPicker.querySelector("strong").textContent = filenames.length === 0
          ? "此屋主尚未設定可選房客"
          : "點擊選擇房客";
      }

      function openGallery(images, folder, selected, onSelect, title = "選擇屋主") {
        options.replaceChildren();
        galleryError.hidden = true;
        dialog.setAttribute("aria-label", title);
        images.forEach((entry, index) => {
          const { filename, name: label } = entry;
          const option = document.createElement("button");
          option.type = "button";
          option.className = "image-option";
          option.dataset.filename = filename ?? "";
          option.setAttribute("aria-label", `選擇 ${label}`);
          option.setAttribute("aria-pressed", String(filename === selected));

          if (filename !== null) {
            const image = document.createElement("img");
            image.alt = "";
            image.addEventListener("error", () => {
              if (!option.isConnected) return;
              option.disabled = true;
              option.title = `無法載入 ${filename}`;
              galleryError.textContent = `部分圖片無法載入，請確認 ${folder} 中的檔名與圖片陣列一致。`;
              galleryError.hidden = false;
            });
            image.src = `./${folder}/${encodeURIComponent(filename)}`;
            option.append(image);
          } else {
            option.classList.add("image-option-none");
          }
          if (folder !== "Tenant") {
            const caption = document.createElement("span");
            caption.textContent = label;
            option.append(caption);
          }
          option.addEventListener("click", () => {
            if (onSelect(entry, index) === false) return;
            dialog.close();
          });
          options.append(option);
        });
        dialog.showModal();
      }

      initializeGroups();
    </script>
  </body>
</html>
